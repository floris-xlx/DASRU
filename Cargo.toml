[package]
name = "dasru"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[lib]
name = "dasru"
path = "src/lib.rs"

[[bin]]
name = "dasru"
path = "src/main.rs"

[features]
desktop-ui = ["dep:egui", "dep:eframe"]

[[bin]]
name = "dasru-gui"
path = "src/bin/dasru-gui.rs"
required-features = ["desktop-ui"]

[dependencies]
egui = { version = "=0.37.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts"], optional = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_Accessibility",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }


